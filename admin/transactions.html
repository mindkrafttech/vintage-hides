<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transaction Ledger — Vintage Hides Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.amount-in { color: var(--green); font-weight: 700; }
.amount-out { color: var(--red); font-weight: 700; }
</style>
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Affiliate Ledger</div>
  </div>
  <div class="content">
    <div class="panel">
      <table class="table">
        <thead>
          <tr><th>Date</th><th>Affiliate</th><th>Type</th><th>Description</th><th>Status</th><th>Amount</th></tr>
        </thead>
        <tbody id="txn-body">
          <tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
let token=localStorage.getItem('vh_admin_token');
if(!token)location.href='/admin/index.html';
const hdr=()=>({'Authorization':`Bearer ${token}`,'Content-Type':'application/json'});
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-placeholder').innerHTML=h;document.querySelector('.nav-item[href="/admin/transactions.html"]')?.classList.add('active');});

function fmt(n){return '₹'+Math.abs(n||0).toLocaleString('en-IN');}

async function load(){
  const res=await fetch(`https://api.vintagehides.com/api/admin/store?section=transactions`,{headers:hdr()});
  if(res.status===401)return location.href='/admin/index.html';
  const data=await res.json();
  const txns=data.transactions||[];
  const tbody=document.getElementById('txn-body');
  if(!txns.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No transactions found</td></tr>';return;}
  tbody.innerHTML=txns.map(t=>`<tr>
    <td>${new Date(t.date).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit'})}</td>
    <td><strong>${t.affiliateName}</strong></td>
    <td><span class="badge ${t.type==='commission'?'badge-confirmed':'badge-dispatched'}">${t.type.toUpperCase()}</span></td>
    <td style="color:var(--muted);font-size:12px;">${t.description}</td>
    <td><span class="badge badge-${t.status}">${t.status}</span></td>
    <td class="${t.amount > 0 ? 'amount-in' : 'amount-out'}">${t.amount > 0 ? '+' : '-'}${fmt(t.amount)}</td>
  </tr>`).join('');
}

load();
</script>
</body>
</html>
