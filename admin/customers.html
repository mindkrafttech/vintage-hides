<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customers — Vintage Hides Admin</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div id="sidebar-placeholder"></div>
<div class="main">
  <div class="topbar">
    <div class="topbar-title">Customers</div>
    <div class="topbar-right"><input class="search-input" id="search" placeholder="Search name/phone..." oninput="load()"></div>
  </div>
  <div class="content">
    <div class="panel">
      <table class="table">
        <thead><tr><th>Name</th><th>Phone</th><th>City</th><th>Orders</th><th>Total Spent</th><th>Joined</th></tr></thead>
        <tbody id="cust-body"><tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">Loading...</td></tr></tbody>
      </table>
    </div>
  </div>
</div>
<script>
let token=localStorage.getItem('vh_admin_token');
if(!token)location.href='/admin/index.html';
const hdr=()=>({'Authorization':`Bearer ${token}`});
fetch('/admin/sidebar.html').then(r=>r.text()).then(h=>{document.getElementById('sidebar-placeholder').innerHTML=h;document.querySelector('.nav-item[href="/admin/customers.html"]')?.classList.add('active');});

async function load(){
  const search=document.getElementById('search').value;
  const res=await fetch(`https://api.vintagehides.com/api/admin/customers?search=${encodeURIComponent(search)}`,{headers:hdr()});
  if(res.status===401)return location.href='/admin/index.html';
  const data=await res.json();
  const customers=data.customers||[];
  const tbody=document.getElementById('cust-body');
  if(!customers.length){tbody.innerHTML='<tr><td colspan="6" style="text-align:center;padding:32px;color:var(--muted)">No customers found</td></tr>';return;}
  tbody.innerHTML=customers.map(c=>`<tr>
    <td><strong>${c.name}</strong><br><span style="font-size:11px;color:var(--muted)">${c.email||'—'}</span></td>
    <td>${c.phone}</td>
    <td>${c.city||'—'}, ${c.state||'—'}</td>
    <td><strong>${c.total_orders||0}</strong></td>
    <td style="font-weight:700;color:var(--green)">₹${(c.total_spent||0).toLocaleString('en-IN')}</td>
    <td style="font-size:11px;">${new Date(c.created_at).toLocaleDateString('en-IN')}</td>
  </tr>`).join('');
}
load();
</script>
</body>
</html>
